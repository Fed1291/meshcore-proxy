  <circle cx="364" cy="285" r="10" fill="none" stroke="#fafafa" stroke-width="1.4"/><text x="364" y="289.5" text-anchor="middle" style="fill:#fafafa;font:700 11px Roboto,sans-serif">i</text>
  <path class="p-ic" d="M37 337 l2 -5 a8 8 0 1 1 3 3 z" style="stroke:#fafafa;stroke-width:1.5"/>
  <text class="p-tl" x="70" y="328" style="font-size:16px">Direct messages</text><text x="70" y="347" style="fill:#e5574c;font:13px Roboto,sans-serif">All messages</text>
  <path class="p-ic" d="M37 380 h14 M36 390 h14 M42 374 l-2 21 M48 374 l-2 21" style="stroke:#fafafa;stroke-width:1.5"/>
  <text class="p-tl" x="70" y="382" style="font-size:16px">Channels</text><text x="70" y="401" style="fill:#e5574c;font:13px Roboto,sans-serif">Mentions only</text>
  <path class="p-ic" d="M37 458 a7 7 0 0 1 14 0 v5 l2 3 h-18 l2 -3 z M41 469 a3 3 0 0 0 6 0" style="stroke:#fafafa;stroke-width:1.5"/>
  <text class="p-tl" x="70" y="440" style="font-size:16px">Keep listening when the app is</text>
  <text class="p-tl" x="70" y="460" style="font-size:16px">closed</text>
  <text class="p-m" x="70" y="480" style="font-size:12.5px">Shows a quiet notification of its own</text>
  <text class="p-m" x="70" y="496" style="font-size:12.5px">while it listens.</text>
