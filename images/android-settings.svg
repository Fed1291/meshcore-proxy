  <g fill="none" stroke="#9a9a9a" stroke-width="2"><circle cx="46" cy="586" r="9"/><circle cx="46" cy="616" r="9"/><circle cx="46" cy="646" r="9"/><circle cx="46" cy="676" r="9"/><circle cx="46" cy="736" r="9"/><circle cx="46" cy="766" r="9"/></g>
