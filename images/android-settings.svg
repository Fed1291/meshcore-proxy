  <g class="p-tl" style="font-size:16px"><text x="70" y="591">the last hour</text><text x="70" y="621">the last 3 hours</text><text x="70" y="651">the last 12 hours</text><text x="70" y="681">the last day</text><text x="70" y="711">the last 2 days</text><text x="70" y="741">the last 3 days</text><text x="70" y="771">everything</text></g>
</svg>